<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Smart Cloud Vault</title>
    <link rel="stylesheet" href="dashboard.css" />
</head>
<body class="no-sidebar">

<div class="main">
    <h1>👑 Admin Dashboard</h1>
    <div class="stats-grid">
        <div class="stat-card">
            <h2 id="users">0</h2>
            <p>Total Users</p>
        </div>
        <div class="stat-card">
            <h2 id="files">0</h2>
            <p>Total Files</p>
        </div>
        <div class="stat-card">
            <h2 id="folders">0</h2>
            <p>Total Folders</p>
        </div>
        <div class="stat-card">
            <h2 id="storage">0 MB</h2>
            <p>Total Storage</p>
        </div>
    </div>
    <br>
    <button class="action-btn" onclick="window.location.href='dashboard.html'">⬅ Back to Dashboard</button>
</div>

<script src="admin.js"></script>
</body>
</html>
